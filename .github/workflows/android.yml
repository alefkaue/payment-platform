name: Build APK (Astro)

# Gera o .apk do app (Capacitor) na nuvem — sem Android SDK local e sem Expo.
# O APK sai como "artefato" da execução (aba Actions do GitHub).

on:
  push:
    branches: [main, monorepo-organizado]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21 (Temurin) — Capacitor 7+ e AGP 8.13 exigem JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK (cmdline-tools fixo + pacotes)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Instalar dependências do app web
        working-directory: app
        run: npm ci

      - name: Vite build (SPA)
        working-directory: app
        run: npm run build

      - name: Montar www (SPA estático)
        working-directory: app
        run: node scripts/assemble-www.mjs

      - name: Copiar web para o Android (sem Capacitor CLI)
        working-directory: app
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r www/. android/app/src/main/assets/public/
          printf '%s' '{"appId":"com.payflow.app","appName":"Astro","webDir":"www","backgroundColor":"#0A0A0A"}' > android/app/src/main/assets/capacitor.config.json
          echo "conteúdo de assets/public:" && ls android/app/src/main/assets/public | head

      - name: Gerar APK de debug
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK gerado com sucesso."
          else
            MSG=$(grep -iE "what went wrong|FAILURE:|Caused by|error:|not found|Unsupported|requires|> " /tmp/gradle.log | tail -n 25 | tr '\n\t' '  ' | cut -c1-1600)
            echo "::error::GRADLE_FAIL $MSG"
            echo "---- tail do log ----"; tail -70 /tmp/gradle.log
            exit 1
          fi

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Astro-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
