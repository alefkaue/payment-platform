name: Build APK (PayFlow)

# Gera o .apk do app (Capacitor) na nuvem — sem Android SDK local e sem Expo.
# O APK sai como "artefato" da execução (aba Actions do GitHub).

on:
  push:
    branches: [main, monorepo-organizado]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (cmdline-tools fixo + pacotes)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Instalar dependências do app web
        working-directory: app
        run: npm ci

      - name: Build web (SPA) + sync Capacitor
        working-directory: app
        run: npm run build:mobile

      - name: Gerar APK de debug
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PayFlow-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
