name: Build APK (Astro)

# Gera o .apk do app (Capacitor) na nuvem — sem Android SDK local e sem Expo.
# O APK sai como "artefato" da execução (aba Actions do GitHub).
#
# Segurança do APK (SEGURANCA.md item 10): chave DPoP no Keystore com atestação
# (plugin ChaveAparelho), certificate pinning da API (scripts/pinos.mjs), sem
# backup, sem print de tela e sem depuração do WebView. Com a chave de assinatura
# nos secrets (ANDROID_KEYSTORE_B64 etc.), sai também o APK release assinado.

on:
  push:
    branches: [main, monorepo-organizado]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21 (Temurin) — Capacitor 7+ e AGP 8.13 exigem JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK (cmdline-tools fixo + pacotes)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Instalar dependências do app web
        working-directory: app
        run: npm ci

      # URL da API na variável do repositório ASTRO_API_URL (Settings → Variables).
      # Sem ela o APK sai em modo demonstração, de propósito (VITE_MODO_DEMO=1):
      # o build de produção recusa sair sem API se ninguém pedir a demonstração.
      - name: Vite build (SPA) + cabeçalhos de segurança
        working-directory: app
        env:
          VITE_API_URL: ${{ vars.ASTRO_API_URL }}
          VITE_MODO_DEMO: ${{ vars.ASTRO_API_URL == '' && '1' || '' }}
        run: npm run build

      - name: Montar www (SPA estático)
        working-directory: app
        run: node scripts/assemble-www.mjs

      - name: Copiar web para o Android (sem Capacitor CLI)
        working-directory: app
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r www/. android/app/src/main/assets/public/
          # webContentsDebuggingEnabled: false — nem o APK de debug abre o WebView no chrome://inspect
          # (quem controla o JavaScript do app pede assinaturas à chave do Keystore).
          printf '%s' '{"appId":"com.payflow.app","appName":"Astro","webDir":"www","backgroundColor":"#0A0A0A","android":{"webContentsDebuggingEnabled":false}}' > android/app/src/main/assets/capacitor.config.json
          echo "conteúdo de assets/public:" && ls android/app/src/main/assets/public | head

      # Pins das CAs da API (falha se a API estiver configurada e não responder).
      - name: Certificate pinning da API
        working-directory: app
        env:
          VITE_API_URL: ${{ vars.ASTRO_API_URL }}
        run: |
          node scripts/pinos.mjs
          cat android/app/src/main/res/xml/network_security_config.xml

      - name: Gerar APK de debug
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK gerado com sucesso."
          else
            MSG=$(grep -iE "what went wrong|FAILURE:|Caused by|error:|not found|Unsupported|requires|> " /tmp/gradle.log | tail -n 25 | tr '\n\t' '  ' | cut -c1-1600)
            echo "::error::GRADLE_FAIL $MSG"
            echo "---- tail do log ----"; tail -70 /tmp/gradle.log
            exit 1
          fi

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Astro-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release assinado: só com a chave nos secrets. A impressão SHA-256 do certificado
      # vai no resumo da execução: é o valor de ATESTACAO_ASSINATURAS no backend.
      - name: Gerar APK release assinado
        id: release
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ASTRO_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ASTRO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASTRO_KEY_SENHA: ${{ secrets.ANDROID_KEY_SENHA }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Sem ANDROID_KEYSTORE_B64 nos secrets: só o APK de debug." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export ASTRO_KEYSTORE="$RUNNER_TEMP/astro.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ASTRO_KEYSTORE"
          ./gradlew assembleRelease --no-daemon
          rm -f "$ASTRO_KEYSTORE"
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          SHA=$(grep -m1 "SHA-256 digest" /tmp/certs.txt | awk '{print $NF}')
          echo "ATESTACAO_ASSINATURAS=$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "gerado=1" >> "$GITHUB_OUTPUT"

      - name: Publicar o APK release
        if: steps.release.outputs.gerado == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Astro-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
