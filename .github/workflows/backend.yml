name: Backend (testes e segurança)

# Testes do backend (SQLite) + testes de concorrência contra um Postgres de verdade
# (lock de linha, idempotência e alçada diária em paralelo) + auditoria de dependências.
# Não publica nada e não usa nenhum segredo.

on:
  push:
    paths:
      - "backend/**"
      - "app/package.json"
      - "app/package-lock.json"
      - "infra/postgres/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app/package.json"
      - "app/package-lock.json"
      - "infra/postgres/**"
  workflow_dispatch: {}
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: somente-ci
          POSTGRES_DB: astro_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astro -d astro_teste"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências
        run: pip install -r requirements.txt pip-audit

      - name: Testes (SQLite)
        run: python -m pytest -q

      # A suíte inteira de novo no Postgres: o SQLite não confere tamanho de coluna nem
      # concorrência (o cadastro com frente+verso só quebrava no Postgres).
      - name: Testes no Postgres (inclui concorrência)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://astro:somente-ci@localhost:5432/astro_teste
        run: python -m pytest -q -rs

      - name: Migrações preservam dados e recusam downgrade inseguro
        env:
          DATABASE_URL: postgresql+psycopg2://astro:somente-ci@localhost:5432/astro_teste
          JWT_SECRET: somente-ci-somente-ci-somente-ci-32
          EMBEDDING_KEY: OTglUQywNhpctpSAKAF71Rz5qH8BLx5plpEZLSij0kk=
        run: |
          psql "postgresql://astro:somente-ci@localhost:5432/astro_teste" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          if alembic downgrade -1; then
            echo "Downgrade de segurança deveria ser recusado."
            exit 1
          fi
          alembic upgrade head
          alembic check   # schema das migrações == modelos

      - name: Credencial runtime e trilha imutável no banco migrado
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: somente-ci
          POSTGRES_USER: astro
          POSTGRES_DB: astro_teste
          DATABASE_APP_PASSWORD: runtime-somente-ci
          DATABASE_MIGRATION_PASSWORD: migracao-somente-ci
          PII_KEYS: Hx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8=
          PII_INDEX_KEY: ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=
          DATABASE_CONTEXT_KEY: ISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISE=
          DATABASE_MIGRATION_URL: postgresql+psycopg2://astro:somente-ci@localhost:5432/astro_teste
          DATABASE_ADMIN_URL: postgresql+psycopg2://astro:somente-ci@localhost:5432/astro_teste
          TEST_ADMIN_DATABASE_URL: postgresql+psycopg2://astro:somente-ci@localhost:5432/astro_teste
          TEST_RUNTIME_DATABASE_URL: postgresql+psycopg2://astro_app:runtime-somente-ci@localhost:5432/astro_teste
        run: |
          sh ../infra/postgres/init-roles.sh
          python scripts/proteger_acesso_banco.py
          python scripts/cifrar_dados_pessoais.py
          python scripts/configurar_isolamento.py
          python scripts/restringir_runtime.py
          python -m pytest tests/test_migracoes_privilegios.py tests/test_acesso_runtime_postgres.py tests/test_isolamento_titulares.py -q
          DATABASE_URL="$TEST_RUNTIME_DATABASE_URL" python scripts/auditar_runtime.py
          DATABASE_URL="$TEST_RUNTIME_DATABASE_URL" python scripts/verificar_banco.py

      - name: Vulnerabilidades conhecidas (pip-audit)
        run: pip-audit -r requirements.txt


  dependencias_front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Vulnerabilidades conhecidas do frontend
        run: npm audit --audit-level=low
      - name: Inventário de dependências (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: app/sbom.cdx.json
