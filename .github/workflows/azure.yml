name: Deploy Azure (Astro)

# Publica a API (Container Apps) e o app web (Static Web Apps) no ambiente do pentest.
# Login no Azure por OIDC: nenhuma senha ou chave guardada no GitHub (ver AZURE.md §3).
# Sem as variáveis do repositório (Settings → Variables) os jobs nem rodam.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - "download/**"
      - ".github/workflows/azure.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # token OIDC para o azure/login
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  RG: ${{ vars.AZURE_RG }}
  ACR: ${{ vars.AZURE_ACR }}
  SWA: ${{ vars.AZURE_SWA }}

jobs:
  api:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Build local no runner (docker está disponível no ubuntu-latest) e push p/ ACR.
      # az acr build usa ACR Tasks, bloqueado em Azure for Students → docker build + push.
      - name: Login Docker no ACR
        run: az acr login -n "$ACR"

      - name: Build e push da imagem
        run: |
          SERVIDOR=$(az acr show -n "$ACR" --query loginServer -o tsv)
          docker build -t "$SERVIDOR/astro-api:${GITHUB_SHA}" -f backend/Dockerfile backend
          docker push "$SERVIDOR/astro-api:${GITHUB_SHA}"

      - name: Migração isolada antes da API
        if: vars.AZURE_MIGRATION_JOB != ''
        env:
          MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
        run: |
          SERVIDOR=$(az acr show -n "$ACR" --query loginServer -o tsv)
          EXECUCAO=$(az containerapp job start -g "$RG" -n "$MIGRATION_JOB" \
            --image "$SERVIDOR/astro-api:${GITHUB_SHA}" --query name -o tsv)
          for tentativa in $(seq 1 60); do
            ESTADO=$(az containerapp job execution show -g "$RG" -n "$MIGRATION_JOB" \
              --job-execution-name "$EXECUCAO" --query properties.status -o tsv)
            case "$ESTADO" in
              Succeeded) exit 0 ;;
              Failed|Stopped) echo "Migração falhou: $ESTADO" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Migração excedeu o tempo permitido." >&2
          exit 1

      - name: Nova revisão da API
        run: |
          SERVIDOR=$(az acr show -n "$ACR" --query loginServer -o tsv)
          az containerapp update -g "$RG" -n astro-api --image "$SERVIDOR/astro-api:${GITHUB_SHA}"
          az containerapp revision list -g "$RG" -n astro-api \
            --query "[?properties.active].{revisao:name, saude:properties.healthState}" -o table

  # App web para a equipe testar — implantado no Container App astro-front.
  front:
    if: vars.AZURE_CLIENT_ID != '' && vars.ASTRO_API_URL != ''
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build e push da imagem do frontend
        env:
          VITE_API_URL: ${{ vars.ASTRO_API_URL }}
        run: |
          SERVIDOR=$(az acr show -n "$ACR" --query loginServer -o tsv)
          az acr login -n "$ACR"
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            -t "$SERVIDOR/astro-front:${GITHUB_SHA}" \
            -f app/Dockerfile.students app
          docker push "$SERVIDOR/astro-front:${GITHUB_SHA}"

      - name: Nova revisão do frontend
        run: |
          SERVIDOR=$(az acr show -n "$ACR" --query loginServer -o tsv)
          az containerapp update -g "$RG" -n astro-front --image "$SERVIDOR/astro-front:${GITHUB_SHA}"
