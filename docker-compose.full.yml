# Stack completo a partir do código local, sem imagens de aplicação do Docker Hub.
# docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.full.yml up -d --build
services:
  backend:
    environment:
      # Modo produção de verdade exige TLS no banco + HTTPS no CORS/DPoP (só na nuvem).
      # No localhost rodamos em 'desenvolvimento', mas com os controles reais LIGADOS:
      # biometria real (STUB=0) e DPoP obrigatório -> é a opção mais segura que roda local.
      AMBIENTE: desenvolvimento
      CNPJ_PROVEDOR: stub
      # Segredos persistentes: --env-file só interpola; não injeta tudo na API.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET em .env.docker}
      EMBEDDING_KEY: ${EMBEDDING_KEY:?defina EMBEDDING_KEY em .env.docker}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA em .env.docker}
      # Simulação financeira/documental; autenticação facial continua real.
      DEPOSITO_DEMO: '1'
      KYC_DOCUMENTO_OBRIGATORIO: '0'
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DPOP_ORIGEM_PUBLICA: ${DOCKER_APP_API_ORIGEM:-http://localhost:8000}
      DPOP_OBRIGATORIO: '1'
      BIOMETRIA_STUB: '0'
      BIOMETRIA_STUB_CADASTRO: '0'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/pronto', timeout=3).status == 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  app:
    build:
      context: ./app
      args:
        VITE_MODE: development
        VITE_MODO_DEMO: '0'
        VITE_API_URL: ${DOCKER_APP_API_ORIGEM:-http://localhost:8000}
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      backend:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
