# Credenciais distintas: bootstrap, migração e API. Banco sem porta publicada.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?defina DATABASE_APP_PASSWORD}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?defina DATABASE_MIGRATION_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - payflow_db_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    environment:
      AMBIENTE: desenvolvimento
      DATABASE_URL: postgresql+psycopg2://astro_migrator:${DATABASE_MIGRATION_PASSWORD:?defina DATABASE_MIGRATION_PASSWORD}@db:5432/${POSTGRES_DB:-payflow}
      DATABASE_MIGRATION_URL: postgresql+psycopg2://astro_migrator:${DATABASE_MIGRATION_PASSWORD:?defina DATABASE_MIGRATION_PASSWORD}@db:5432/${POSTGRES_DB:-payflow}
    entrypoint: [/bin/sh, -ec]
    command: ['alembic upgrade head && python scripts/restringir_runtime.py']
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - 127.0.0.1:8000:8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://astro_app:${DATABASE_APP_PASSWORD:?defina DATABASE_APP_PASSWORD}@db:5432/${POSTGRES_DB:-payflow}
      RUN_MIGRATIONS: '0'
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Banco administrador/migrador não são necessários no processo da API.
    # Não coloque suas senhas em .env: prefira .env.docker (interpolação Compose).
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

volumes:
  payflow_db_data:
