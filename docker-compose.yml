# Sobe backend + Postgres. Credenciais e segredos vêm do arquivo .env (copie de
# .env.example). Nada de senha escrita aqui: o compose falha com mensagem clara
# se POSTGRES_PASSWORD não estiver definida.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # "db" é o nome do serviço abaixo (DNS interno do Compose), não localhost.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-payflow}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
    volumes:
      # Persiste entre "docker compose down/up"; "down -v" apaga.
      - payflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Porta 5432 não exposta de propósito. Para inspecionar com DBeaver/psql, descomente:
    # ports:
    #   - "5432:5432"

volumes:
  payflow_db_data:
