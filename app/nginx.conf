# Serve o SPA (shell em _shell.html) e devolve o shell para rotas do cliente.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        _shell.html;

    server_tokens off;

    # Assets com hash no nome: cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Qualquer rota do app cai no shell (roteamento é no cliente).
    location / {
        try_files $uri /_shell.html;
    }

    # Cabeçalhos de segurança (defesa básica para o pentest).
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "no-referrer"        always;
    add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src *; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
