# Serve o SPA (shell em _shell.html) e devolve o shell para rotas do cliente.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        _shell.html;

    server_tokens off;

    # Assets com hash no nome: cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Qualquer rota do app cai no shell (roteamento é no cliente).
    location / {
        try_files $uri /_shell.html;
    }

    # Mesma CSP dos demais hosts estáticos; hashes do HTML final.
    include /etc/nginx/security-headers.conf;
}
